name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: marine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/marine
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/marine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Create runtime role and migrate database
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE marine_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION"
          python -m backend.migrate
      - name: Run Python tests
        run: python -m pytest backend/tests -v
      - name: Audit Python runtime dependencies
        run: pip-audit -r backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
